name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit and repository tests (no API, no network)
        run: npm test
      - name: Validate the plugin marketplace
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - name: Lint shell scripts
        run: shellcheck plugins/brand-film/skills/brand-film/scripts/scaffold.sh scripts/test-render.sh
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: npx -y playwright@1.64.1 install --with-deps chromium
      - name: Render the template and the example, silent, and check the reports
        run: npm run test:render
