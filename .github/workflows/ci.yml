name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit and repository tests (no API, no network)
        run: npm test
      - name: Validate the plugin marketplace
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - name: Lint shell scripts
        run: shellcheck plugins/brand-film/skills/brand-film/scripts/scaffold.sh scripts/test-render.sh
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The runner's Google Chrome, as on a Mac. A pinned `playwright install`
      # broke when the template's floating playwright-core moved past it and
      # looked for a browser build that wasn't there.
      - name: Use the runner's Google Chrome
        run: |
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Render the template and the example, silent, and check the reports
        run: npm run test:render
