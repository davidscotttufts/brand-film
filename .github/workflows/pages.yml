# Publishes the gallery: docs/ plus the example film from the latest release.
# The film is a release asset, never a file in git.
name: Pages
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp docs/* _site/
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'how-it-works*' --dir _site
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
